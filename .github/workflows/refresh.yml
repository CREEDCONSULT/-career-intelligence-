name: Monthly data refresh

on:
  schedule:
    - cron: "0 6 3 * *" # 06:00 UTC on the 3rd (Job Bank publishes early-month)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Download sources
        run: |
          python scripts/download_job_bank_postings.py --months 12
          python scripts/download_job_bank_wages.py --years 3
          python scripts/download_indeed_trends.py
          python scripts/download_statscan_jvws.py   # gracefully skips if unreachable

      - name: Transform
        run: python scripts/transform.py

      - name: LLM skill extraction (runs only if the repo secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python scripts/extract_skills_llm.py
          else
            echo "Skipped: no ANTHROPIC_API_KEY secret. Dashboard falls back to dictionary skills."
          fi

      - name: Validate (fails the run on data-quality regression)
        run: python scripts/validate.py

      - name: Commit refreshed database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/career_intel.duckdb
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: scheduled monthly refresh"
            git push
          fi
