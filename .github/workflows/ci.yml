name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-bm25-v1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts streamlit_app

      - name: Populate job_skills_llm (CI fixture)
        # CI-only deterministic dictionary extraction so the role-match corpus
        # exists in test runs. NOT production data: provenance is recorded in
        # job_skills_llm_meta (source='fixture:flashtext'). Production requires
        # a live run of the same script with an LLM API key and no --fixture.
        run: python scripts/extract_skills_llm.py --fixture

      - name: Test
        # Live-API tests self-skip without ANTHROPIC_API_KEY/OPENAI_API_KEY.
        # App smoke + eval-gold tests run against the committed demo DuckDB.
        run: pytest -q
