name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts streamlit_app

      - name: Test
        # Live-API tests self-skip without ANTHROPIC_API_KEY/OPENAI_API_KEY.
        # App smoke + eval-gold tests run against the committed demo DuckDB.
        run: pytest -q
